  <style>.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.2s ease-in-out infinite}.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}.final{animation:final 5.2s ease-in-out infinite}.token{animation:token 5.2s cubic-bezier(.23,1,.32,1) infinite}.path{stroke-dasharray:8 10;animation:dash 2s linear infinite}@keyframes pulse{0%,100%{opacity:.68;transform:scale(1)}18%,30%{opacity:1;transform:scale(1.045)}}@keyframes final{0%,62%{opacity:.7;transform:translateY(0)}75%,88%{opacity:1;transform:translateY(-4px)}}@keyframes token{0%,8%{opacity:0;transform:translate(0,0)}12%,26%{opacity:1;transform:translate(190px,0)}30%,42%{opacity:1;transform:translate(375px,154px)}46%,58%{opacity:1;transform:translate(560px,0)}62%,100%{opacity:0;transform:translate(560px,0)}}@keyframes dash{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
