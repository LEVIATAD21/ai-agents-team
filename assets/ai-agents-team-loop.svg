<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Agents Team — colaboração sequencial</title>
  <desc id="desc">Uma tarefa percorre agentes de planejamento, execução e revisão até formar uma síntese.</desc>
